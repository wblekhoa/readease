[package]
name = "app"
version = "0.1.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.22.2"
base64 = "0.23.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-window-state = "2.4.1"
# Now Playing + the media keys (HIG 3.19): the MediaPlayer framework.
objc2-media-player = { version = "0.3.2", features = ["MPNowPlayingInfoCenter", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPMediaItem", "block2"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSValue"] }
block2 = "0.6"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
libc = "0.2"

