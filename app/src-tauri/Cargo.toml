[package]
name = "app"
version = "0.1.19"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.22.2"
base64 = "0.23.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-window-state = "2.4.1"
# Now Playing + the media keys (HIG 3.19): the MediaPlayer framework.
objc2-media-player = { version = "0.3.2", features = ["MPNowPlayingInfoCenter", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPMediaItem", "block2", "objc2-app-kit", "objc2-core-foundation"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSValue", "NSData"] }
# The cover in Now Playing (HIG 3.19): an NSImage from the page's bytes,
# handed to MPMediaItemArtwork's request block.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
block2 = "0.6"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
libc = "0.2"


# Build scripts and proc-macros only - never the app binary. With Tauri's
# MACOSX_DEPLOYMENT_TARGET set, a proc-macro dylib stripped by the Xcode 27
# toolchain is refused by macOS 27's dyld ("mis-aligned LINKEDIT string
# pool") and rustc reports it as "can't find crate": every fresh target/
# failed that way on 25/09. They run at compile time and never ship.
[profile.release.build-override]
strip = "none"
