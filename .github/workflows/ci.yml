# The gates every pull request has to pass, run where no one has to
# remember to run them (plan 21/09, Phase 1). The same commands as
# scripts/verify.sh and `pnpm build`, split in two so a Rust failure and a
# Python failure are named apart. No sidecar is built here: Tauri only
# needs the resource directory to exist, and the 260 MB PyInstaller bundle
# is a release-time artefact. No secrets are used or needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build (tsc, vite, UI_AUDIT, MOCK_AUDIT, node tests)
        working-directory: app
        run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Stand in for the sidecar
        run: mkdir -p app/src-tauri/engine && touch app/src-tauri/engine/readease-engine
      - name: Rust receipts
        working-directory: app/src-tauri
        run: cargo test --lib

  engine:
    name: engine
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: uv run --frozen python -W error -m unittest discover -s tests -q
      - name: compileall
        run: uv run --frozen python -m compileall -q src tests
      - name: Native selection bridge
        run: ./scripts/test-native-selection-bridge.sh
