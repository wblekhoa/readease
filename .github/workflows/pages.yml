# The landing page: React/Vite with prerendered VI/EN HTML.
# Deployed from main whenever the page or the screenshots it shows change;
# the download button asks GitHub for the newest release at view time, so
# a release alone needs no redeploy.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Test and build the site
        run: |
          npm ci --prefix site --no-fund
          npm run verify --prefix site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
